<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-Kong 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>T-Kong</h1>
      <p class="lead">動作のオン／オフを切り替えられます。記事情報はブラウザ内のローカルストレージのみに保存されます。</p>

      <section>
        <h2>自動化</h2>
        <label>
          <input type="checkbox" id="autoConsent" />
          <span>
            日経テレコンの利用許諾画面で「同意する」を自動的に選択します。利用許諾への同意を伴うため、内容を確認したうえで有効にしてください。
          </span>
        </label>
        <label>
          <input type="checkbox" id="autoOpenAfterConsent" />
          同意後、保存記事があれば自動で検索・オープンを続行
        </label>
        <label>
          <input type="checkbox" id="autoClickResult" />
          検索結果の一致見出しを自動クリック
        </label>
        <label>
          <input type="checkbox" id="showFloatingButton" />
          テレコン画面に「保存記事を開く」ボタンを表示
        </label>
      </section>

      <section>
        <h2>タイトル処理</h2>
        <label>
          <input type="checkbox" id="preferHeadline" />
          保存時はページ見出し（h1）を優先
        </label>
        <label>
          <input type="checkbox" id="stripTitlePrefixes" />
          「決算:」などの接頭辞と「日経新聞」末尾を除去
        </label>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
      <p class="note">
        非公式の補助拡張です。T-Kong独自サーバーへの送信はありません。楽天証券のID・パスワード、Cookie、SSO、有料本文は扱いません。対象サイトとの通常のHTTPS通信は発生します。
      </p>
    </main>
    <script src="../shared/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
